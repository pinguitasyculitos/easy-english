<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Control Room English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Radio de planta: lo que llega es una transmisión entrante (escuchar), lo que dices es tu transmisión (hablar).
   Concreto frío de fondo, naranja de chaleco reflectivo para la acción, azul de canal para el audio. Una columna en el celular. */
:root{
  --bg:#E9EDF1; --card:#F8FAFB; --card2:#DFE5EB; --line:#C2CBD4; --ink:#14202B; --ink2:#4A5866;
  --accent:#B93D0C; --accent-ink:#FFFFFF; --accent-bg:#FBE4D6; --radio:#0E5A86; --radio-bg:#DCEAF4;
  --ok:#1E7347; --ok-bg:#D8EEE1; --warn:#8A5D00; --warn-bg:#F6E8C3; --bad:#B42318; --bad-bg:#F8DBD7;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --navh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --card:#18212A; --card2:#212C37; --line:#34414E; --ink:#E5EBF0; --ink2:#9BA9B6;
    --accent:#FF8A4C; --accent-ink:#1A0E07; --accent-bg:#3B2216; --radio:#74BCE6; --radio-bg:#16303F;
    --ok:#62C793; --ok-bg:#163020; --warn:#E3B64B; --warn-bg:#33290F; --bad:#F2857A; --bad-bg:#3B1C19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --card:#18212A; --card2:#212C37; --line:#34414E; --ink:#E5EBF0; --ink2:#9BA9B6;
  --accent:#FF8A4C; --accent-ink:#1A0E07; --accent-bg:#3B2216; --radio:#74BCE6; --radio-bg:#16303F;
  --ok:#62C793; --ok-bg:#163020; --warn:#E3B64B; --warn-bg:#33290F; --bad:#F2857A; --bad-bg:#3B1C19; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--radio);outline-offset:2px}
a{color:var(--radio)}
.app{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--navh) + 28px)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);position:relative;overflow:hidden}
.mark::before,.mark::after{content:"";position:absolute;left:0;right:0;height:5px;background:var(--card);opacity:.9}
.mark::before{top:9px}.mark::after{bottom:9px}
.brand b{display:block;font-family:var(--display);font-size:22px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3;margin-top:3px}
.hstats{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.pill{font-family:var(--display);font-size:16px;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:1px 9px;border-radius:5px;letter-spacing:.03em}
.pill.dim{background:var(--card2);color:var(--ink2)}
.icon{background:var(--card);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;padding:0}
.icon svg,.tabs svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync{font-size:12px}
/* navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink2);min-height:var(--navh);justify-content:center}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:760px){
  :root{--navh:0px}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;grid-template-columns:repeat(5,1fr)}
  .tabs button{flex-direction:row;gap:8px;font-size:14px;min-height:46px}
}
/* tipografía y bloques */
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:34px}h2{font-size:26px}h3{font-size:20px}
p{margin:0 0 10px}
.lead{color:var(--ink2);font-size:15px}
.small{font-size:13px;color:var(--ink2)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:11px 16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card);min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.radio{background:var(--radio-bg);border-color:var(--radio);color:var(--radio)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding-inline:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--radio);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.acc{background:var(--accent-bg);color:var(--accent)}
/* nivel A1→C1 como tanque */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 6px}
.track div{position:relative;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--card2);overflow:hidden}
.track span.f{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.85}
.track div.pass span.f{background:var(--ok);opacity:.9}
.track b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:19px;color:var(--ink);mix-blend-mode:normal}
.track div.cur{outline:2px solid var(--accent);outline-offset:1px}
.big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{background:var(--card2);border-radius:8px;padding:8px 10px;min-width:0}
.kpis b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--ink2)}
/* turno de hoy */
ol.blocks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.blocks li button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
ol.blocks li button:hover{border-color:var(--accent)}
ol.blocks .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:17px;background:var(--card2)}
ol.blocks li.done .n{background:var(--ok);color:var(--card)}
ol.blocks b{display:block;font-size:15.5px}
ol.blocks small{display:block;color:var(--ink2);font-size:13px;line-height:1.35}
/* práctica */
.runhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.prog span{display:block;height:100%;background:var(--accent)}
.incoming{background:var(--radio-bg);border:1px solid var(--radio);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.incoming .eyebrow{color:var(--radio)}
.play{display:flex;align-items:center;gap:14px}
.playbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--radio);color:var(--card);display:grid;place-items:center;flex:none}
.playbtn svg{width:28px;height:28px;fill:currentColor;stroke:none}
.wave{display:flex;gap:4px;align-items:center;height:34px}
.wave i{width:5px;height:10px;border-radius:3px;background:var(--radio);opacity:.5}
.wave.on i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:8px}50%{height:32px}}
.cue{font-size:20px;font-weight:600;line-height:1.35}
.cue.en{font-family:var(--body)}
.es{color:var(--ink2);font-size:15px}
.hidden-text{filter:blur(6px);user-select:none}
.tx{border:2px solid var(--accent);border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.tx .eyebrow{color:var(--accent);display:flex;justify-content:space-between;gap:8px;align-items:center}
.tx textarea{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-family:var(--mono);font-size:16px;line-height:1.45}
.tx.tall textarea{min-height:150px}
.hint{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.hint svg{width:16px;height:16px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg)}.fb.near{background:var(--warn-bg)}.fb.bad{background:var(--bad-bg)}
.fb h3{font-size:22px}
.diff{font-family:var(--mono);font-size:15.5px;line-height:1.9}
.w{padding:1px 4px;border-radius:4px}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.near{background:var(--warn-bg);color:var(--warn);text-decoration:underline dotted}
.w.sub{background:var(--bad-bg);color:var(--bad)}.w.sub s{opacity:.7}
.w.miss{background:var(--bad-bg);color:var(--bad);text-decoration:underline}
.w.extra{color:var(--ink2)}
.legendw{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:12px;padding:10px 12px;font-size:16px}
.msg.them{align-self:flex-start;background:var(--radio-bg);border:1px solid var(--radio)}
.msg.me{align-self:flex-end;background:var(--accent-bg);border:1px solid var(--accent);font-family:var(--mono);font-size:15px}
.msg .meta{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink2);font-size:14px}
.thinking i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
/* evaluación */
.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scores div{background:var(--card2);border-radius:8px;padding:8px 6px;text-align:center;min-width:0}
.scores b{display:block;font-family:var(--display);font-size:24px}
.scores span{font-size:11px;color:var(--ink2);display:block;line-height:1.2}
.fix{border-left:4px solid var(--warn);background:var(--card2);padding:8px 10px;border-radius:0 8px 8px 0;font-size:15px}
.fix s{color:var(--bad)} .fix b{color:var(--ok);font-weight:600}
.phr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.phr div{min-width:0}
/* ruta */
.lvhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.units button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.units button:hover{border-color:var(--accent)}
.units button.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.units b{font-size:15px;line-height:1.25}
.units small{color:var(--ink2);font-size:12.5px;line-height:1.3}
.meter{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter span.full{background:var(--ok)}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.pitem .en{font-weight:600}
.pitem .es{font-size:13.5px}
.box{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
/* progreso */
.bars14{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars14 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars14 span.b{width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars14 small{font-size:10.5px;color:var(--ink2);font-family:var(--mono)}
.lvbar{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.lvbar b{font-family:var(--display);font-size:18px}
.lvbar output{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:13px;color:var(--ink2)}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--ink);margin-bottom:12px}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:10px;padding:10px 12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.fld input,label.fld select{font-weight:400;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);min-height:44px;max-width:100%}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.toggle input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.how{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.how div{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
.how b{display:block;font-size:13.5px}
@media (max-width:560px){
  h1{font-size:29px}
  .units,.how{grid-template-columns:1fr}
  .scores{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis b{font-size:21px}
  .cue{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>Control Room English</b><small>Inglés americano para planta concentradora · A1 → C1</small></div></div>
  <div class="hstats"><span class="pill" id="hLevel">A1</span><span id="hStreak"></span><span id="hHours"></span><button class="icon" id="btnSettings" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</header>
<nav class="tabs" id="tabs" aria-label="Secciones">

<script>
/* ====================== CONTENIDO: RUTA A1 → C1 ====================== */
const LEVELS=[
 {id:'A1',h:100,name:'Principiante',
  can:'Entiendes y dices frases muy cortas: saludarte, presentarte, números, horas, equipos de la planta y órdenes de seguridad.',
  talk:'Use very simple words and short sentences (5 to 8 words). Speak slowly and clearly.',maxw:15,rate:0.8,words:60},
 {id:'A2',h:200,name:'Básico',
  can:'Sostienes conversaciones de rutina: tu trabajo, el turno, lo que pasó ayer, pedir ayuda y hablar por radio.',
  talk:'Use simple sentences and everyday words. Avoid idioms.',maxw:25,rate:0.88,words:110},
 {id:'B1',h:400,name:'Intermedio',
  can:'Explicas problemas y sus causas, describes procedimientos, cuentas experiencias y das opiniones. Entiendes reuniones claras.',
  talk:'Speak clearly and naturally, with common phrasal verbs and linking words.',maxw:35,rate:0.95,words:180},
 {id:'B2',h:600,name:'Intermedio alto',
  can:'Discutes temas técnicos con fluidez, defiendes tu punto de vista y entiendes reuniones y presentaciones a velocidad normal.',
  talk:'Speak at natural speed with idiomatic workplace language. Challenge my ideas a little.',maxw:50,rate:1.0,words:280},
 {id:'C1',h:800,name:'Avanzado',
  can:'Hablas con fluidez y precisión sin buscar palabras, matizas, lideras reuniones, presentas a gerencia y entiendes charlas largas y lo que se dice entre líneas.',
  talk:'Speak like a demanding native-speaker colleague: idioms, implied meaning, pushback and follow-up questions that require nuance.',maxw:60,rate:1.08,words:380}
];
const LV_IDX={A1:0,A2:1,B1:2,B2:3,C1:4};

const UNITS=[
/* ---------------- A1 ---------------- */
{id:'a1u1',lv:'A1',t:'Saludos y presentación',en:'Meeting the team',
 ctx:'First day at a copper concentrator in Arizona. The learner meets a coworker in the control room.',

{id:'a2u4',lv:'A2',t:'Describir el proceso',en:'How the plant works',

 goal:'Explica el proceso en orden y compara etapas.',focus:'First, then, after that · comparativos · more / less than',
 ch:[['First, the ore goes to the crusher.','Primero, el mineral va a la chancadora.'],['Then it goes to the SAG mill.','Luego va al molino SAG.'],['The cyclones separate fine and coarse particles.','Los ciclones separan partículas finas y gruesas.'],['The fine particles go to flotation.','Las partículas finas van a flotación.'],['The concentrate has about twenty-five percent copper.','El concentrado tiene unos veinticinco por ciento de cobre.'],['The tailings go to the thickener.','Los relaves van al espesador.'],['Grinding uses more energy than flotation.','La molienda usa más energía que la flotación.'],['The final concentrate is cleaner than the rougher concentrate.','El concentrado final es más limpio que el concentrado rougher.']],

{id:'b1u1',lv:'B1',t:'Explicar un problema y su causa',en:'Why did recovery drop?',
 ctx:'Recovery dropped three points this morning. The superintendent asks the learner for an explanation.',
 role:'Brian, the concentrator superintendent',me:'the plant metallurgist',
 goal:'Explica qué pasó, por qué y qué propones.',focus:'Because, so, that\'s why · might / could · condicional cero y primero',
 ch:[['Recovery dropped because the grind got coarser.','La recuperación bajó porque la molienda se hizo más gruesa.'],['The cyclone pressure was too low, so the overflow was coarse.','La presión de ciclones estaba muy baja, así que el rebose salió grueso.'],['I think the problem started when the ore changed.','Creo que el problema empezó cuando cambió el mineral.'],['It might be the frother pump.','Podría ser la bomba de espumante.'],['We need to find the root cause.','Tenemos que encontrar la causa raíz.'],['If the pH drops, pyrite floats.','Si baja el pH, flota la pirita.'],['If we close one cyclone, the pressure will go up.','Si cerramos un ciclón, la presión va a subir.'],['That\'s why the grade went down.','Por eso bajó la ley.']],
 tasks:[{es:'Explica a tu superintendente por qué bajó la recuperación y qué propones hacer.',en:'Explain to your superintendent why recovery dropped and what you propose to do.'},{es:'Describe un problema real de tu planta, su causa y la solución.',en:'Describe a real problem in your plant, its cause and the solution.'}]},
{id:'b1u2',lv:'B1',t:'Procedimientos e instrucciones',en:'Walking through a procedure',

{id:'b2u1',lv:'B2',t:'Discusión técnica con datos',en:'Reading the data',

 goal:'Interpreta datos, señala relaciones y límites del análisis.',focus:'The data suggests · compared to · correlation · that said',
 ch:[['The data suggests that recovery is sensitive to grind size above one hundred eighty microns.','Los datos sugieren que la recuperación es sensible al tamaño de molienda sobre ciento ochenta micrones.'],['Compared to last month, reagent consumption is up twelve percent.','Comparado con el mes pasado, el consumo de reactivos subió doce por ciento.'],['There is a strong correlation between clay content and froth stability.','Hay una fuerte correlación entre el contenido de arcillas y la estabilidad de la espuma.'],['That said, the sample size is quite small.','Dicho eso, el tamaño de la muestra es bastante pequeño.'],['We can\'t rule out an instrument error.','No podemos descartar un error de instrumento.'],['The trend is clear, but the cause isn\'t.','La tendencia es clara, pero la causa no.'],['I\'d take these numbers with a grain of salt.','Tomaría estos números con pinzas.'],['Let me break it down for you.','Déjame explicártelo por partes.']],
 tasks:[{es:'Explica qué dicen los datos del mes: recuperación, P80 y reactivos, y qué límites tiene el análisis.',en:'Explain what last month\'s data shows about recovery, grind size and reagents, and the limits of the analysis.'},{es:'Defiende una hipótesis sobre por qué cayó la ley, con evidencia.',en:'Defend a hypothesis about why concentrate grade dropped, using evidence.'}]},

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* ---------- normalización de lo dicho ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){
  n=Math.floor(n);if(n<20)return ONES[n];
  if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');
  if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+n2w(n%100):'');
  for(const [v,w] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand']])if(n>=v)return n2w(Math.floor(n/v))+' '+w+(n%v?' '+n2w(n%v):'');
  return String(n);
}
const ORD={'1st':'first','2nd':'second','3rd':'third','4th':'fourth','5th':'fifth','6th':'sixth','7th':'seventh','8th':'eighth','9th':'ninth','10th':'tenth'};
const CONTR=[[/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],[/\bshan't\b/g,'shall not'],[/\bain't\b/g,'is not'],[/n't\b/g,' not'],
  [/\blet's\b/g,'let us'],[/'m\b/g,' am'],[/'re\b/g,' are'],[/'ve\b/g,' have'],[/'ll\b/g,' will'],[/'d\b/g,' would'],
  [/\b(it|that|what|where|there|here|who|how|he|she)'s\b/g,'$1 is']];
const EQUIV={dont:'do not',cant:'can not',isnt:'is not',arent:'are not',wasnt:'was not',werent:'were not',didnt:'did not',doesnt:'does not',havent:'have not',hasnt:'has not',couldnt:'could not',wouldnt:'would not',shouldnt:'should not',im:'i am',ive:'i have',youre:'you are',theyre:'they are',lets:'let us',thats:'that is',whats:'what is',theres:'there is',sometime:'some time',anytime:'any time',everyday:'every day',alright:'all right',tonnes:'tons',tonne:'ton',okay:'ok','o.k.':'ok',gonna:'going to',wanna:'want to',gotta:'got to',grey:'gray',metre:'meter',metres:'meters',litre:'liter',litres:'liters',centre:'center',per:'per',hrs:'hours',hr:'hour',mins:'minutes',min:'minutes'};
function norm(s){
  s=String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"');
  s=s.replace(/\ba\.m\./g,'am').replace(/\bp\.m\./g,'pm').replace(/\bu\.s\.a?\.?/g,'us').replace(/\bmr\./g,'mister').replace(/\bdr\./g,'doctor');
  s=s.replace(/\$(\d[\d,]*(?:\.\d+)?)\s*(million|billion|thousand)?/g,(m,a,b)=>a+(b?' '+b:'')+' dollars');
  s=s.replace(/(\d),(\d{3})/g,'$1$2').replace(/(\d),(\d{3})/g,'$1$2');
  s=s.replace(/(\d+)\s*%/g,'$1 percent');
  s=s.replace(/\b(\d{1,2}):(\d{2})\b/g,(m,h,mi)=>n2w(+h)+(+mi===0?'':(+mi<10?' oh '+n2w(+mi):' '+n2w(+mi))));
  s=s.replace(/\b(\d+)(st|nd|rd|th)\b/g,(m)=>ORD[m]||m.replace(/\D/g,''));
  s=s.replace(/\b(\d+)\.(\d+)\b/g,(m,a,b)=>n2w(+a)+' point '+b.split('').map(d=>ONES[+d]).join(' '));
  s=s.replace(/\b\d+\b/g,m=>m.length>12?m:n2w(+m));
  CONTR.forEach(([r,v])=>{s=s.replace(r,v);});
  s=s.replace(/[-–—/]/g,' ').replace(/[^a-z0-9'\s]/g,' ').replace(/'/g,'');
  let t=s.split(/\s+/).filter(Boolean).map(w=>EQUIV[w]||w).join(' ').split(' ');
  const out=[];let letters=false;
  for(const w of t){const single=w.length===1&&!/^[ai]$/.test(w);if(single&&letters)out[out.length-1]+=w;else{out.push(w);letters=single;}}
  return out.join(' ').replace(/\bwi fi\b/g,'wifi').split(' ').filter(Boolean);
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function near(a,b){if(a===b)return true;if(Math.min(a.length,b.length)<4)return false;return lev(a,b)/Math.max(a.length,b.length)<=0.25;}
/* alineación palabra a palabra entre lo esperado y lo dicho */
function align(target,said){
  const T=norm(target),H=norm(said),m=T.length,n=H.length;
  const D=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)D[i][0]=i;for(let j=0;j<=n;j++)D[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=T[i-1]===H[j-1]?0:near(T[i-1],H[j-1])?0.5:1;D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+c);}
  const ops=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0){const c=T[i-1]===H[j-1]?0:near(T[i-1],H[j-1])?0.5:1;if(D[i][j]===D[i-1][j-1]+c){ops.push({t:T[i-1],h:H[j-1],k:c===0?'ok':c===0.5?'near':'sub'});i--;j--;continue;}}
    if(i>0&&D[i][j]===D[i-1][j]+1){ops.push({t:T[i-1],h:null,k:'miss'});i--;continue;}
    ops.push({t:null,h:H[j-1],k:'extra'});j--;
  }
  ops.reverse();
  const ok=ops.filter(o=>o.k==='ok').length,nr=ops.filter(o=>o.k==='near').length,ex=ops.filter(o=>o.k==='extra').length;
  const score=m?clamp((ok+0.5*nr-0.5*Math.max(0,ex-1))/m,0,1):0;
  return {ops,score,T,H};
}
function diffHTML(al){
  return '<span class="diff">'+al.ops.map(o=>{
    if(o.k==='ok')return `<span class="w ok">${esc(o.t)}</span>`;
    if(o.k==='near')return `<span class="w near" title="Dijiste: ${esc(o.h)}">${esc(o.t)}</span>`;
    if(o.k==='sub')return `<span class="w sub"><s>${esc(o.h)}</s> ${esc(o.t)}</span>`;
    if(o.k==='miss')return `<span class="w miss">${esc(o.t)}</span>`;
    return `<span class="w extra">+${esc(o.h)}</span>`;
  }).join(' ')+'</span>';
}
function words(s){return norm(s).length;}

let ST=Object.assign(blankState(),lsGet('cre_state',{}));
['passed','srs','units','pairs','days','custom','exams','session'].forEach(k=>{if(!ST[k]||typeof ST[k]!=='object'||Array.isArray(ST[k]))ST[k]={};});
if(!Array.isArray(ST.evals))ST.evals=[];
const CLOUD={ref:null,busy:false,dirty:false,timer:0};
function setSync(t){const e=$('#sync');if(e)e.textContent=t;}
function save(now){
  lsSet('cre_state',ST);
  if(!CLOUD.ref)return;
  CLOUD.dirty=true;
  clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(flushCloud,now?0:2500);
}
async function flushCloud(){
  if(!CLOUD.ref||!CLOUD.dirty||CLOUD.busy)return;
  CLOUD.busy=true;CLOUD.dirty=false;
  try{await CLOUD.ref.set(JSON.parse(JSON.stringify(ST)));setSync('Guardado en tu cuenta');}
  catch(e){setSync('Guardado en este navegador');}
  CLOUD.busy=false;if(CLOUD.dirty)CLOUD.timer=setTimeout(flushCloud,2500);
}
function mergeState(o){
  if(!o||typeof o!=='object')return;
  ['name','unit','voice','voice2'].forEach(k=>{if(o[k]&&!ST[k])ST[k]=o[k];});
  Object.entries(o.passed||{}).forEach(([k,v])=>{if(!ST.passed[k])ST.passed[k]=v;});
  Object.entries(o.srs||{}).forEach(([k,v])=>{const c=ST.srs[k];if(!c||(v.n||0)>(c.n||0))ST.srs[k]=v;});
  Object.entries(o.units||{}).forEach(([k,v])=>{const c=ST.units[k]||{};ST.units[k]={rp:Math.max(c.rp||0,v.rp||0),tk:Object.assign({},v.tk||{},c.tk||{}),ls:Math.max(c.ls||0,v.ls||0)};
    Object.entries(v.tk||{}).forEach(([i,s])=>{ST.units[k].tk[i]=Math.max(s,(c.tk||{})[i]||0);});});
  Object.entries(o.pairs||{}).forEach(([k,v])=>{const c=ST.pairs[k];if(!c||(v.n||0)>(c.n||0))ST.pairs[k]=v;});
  Object.entries(o.days||{}).forEach(([k,v])=>{const c=ST.days[k];if(!c||(v.sec||0)>(c.sec||0))ST.days[k]=v;});
  Object.entries(o.custom||{}).forEach(([k,v])=>{if(!ST.custom[k])ST.custom[k]=v;});
  Object.entries(o.exams||{}).forEach(([k,v])=>{if(!ST.exams[k]||(v.length||0)>(ST.exams[k].length||0))ST.exams[k]=v;});
  if(Array.isArray(o.evals)){const seen=new Set(ST.evals.map(e=>e.at));o.evals.forEach(e=>{if(!seen.has(e.at))ST.evals.push(e);});ST.evals.sort((a,b)=>a.at-b.at);ST.evals=ST.evals.slice(-60);}
}

    CLOUD.ref=db.doc('data/users/'+id+'/state');
    const snap=await CLOUD.ref.get();
    if(snap.exists)mergeState(snap.data());
    setSync('Guardado en tu cuenta');save(true);
    if(typeof rerender==='function')rerender();
  }catch(e){CLOUD.ref=null;}
}

['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));

function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const r=ST.days[k];if(r&&r.sec>=300)n++;else if(n>0||k!==today())break;d.setDate(d.getDate()-1);if(n>3650)break;}return n;}

/* ---------- frases y repaso espaciado ---------- */
function nameOf(){return (ST.name||'').trim()||'Alex';}
function sub(s){return String(s).replace(/\{name\}/g,nameOf());}
const CHUNKS={};
UNITS.forEach(u=>u.ch.forEach((c,i)=>{CHUNKS[u.id+'-'+i]={id:u.id+'-'+i,en:c[0],es:c[1],u:u.id,lv:u.lv};}));
function chunk(id){if(CHUNKS[id])return CHUNKS[id];const c=ST.custom[id];return c?{id,en:c.en,es:c.es,u:c.u||null,lv:c.lv||null,custom:true}:null;}
function srsGet(id){return ST.srs[id]||{b:0,due:0,n:0,l:0};}
function srsUpdate(id,ok){
  const s=Object.assign({},srsGet(id));s.n=(s.n||0)+1;
  if(ok){s.b=Math.min(BOX_DAYS.length-1,(s.b||0)+1);s.due=Date.now()+BOX_DAYS[s.b]*DAY-3600000;}
  else{s.l=(s.l||0)+1;s.b=1;s.due=Date.now()+10*60000;}
  ST.srs[id]=s;save();return s;
}
function dueCards(limit){
  const now=Date.now();
  return Object.keys(ST.srs).filter(id=>chunk(id)&&ST.srs[id].n>0&&ST.srs[id].due<=now).sort((a,b)=>ST.srs[a].due-ST.srs[b].due).slice(0,limit);
}
function newChunksFrom(uid,limit){
  const order=UNITS.slice(UNITS.findIndex(u=>u.id===uid));
  const out=[];
  for(const u of order){for(let i=0;i<u.ch.length;i++){const id=u.id+'-'+i;if(!ST.srs[id]||!ST.srs[id].n){out.push(id);if(out.length>=limit)return out;}}}
  return out;
}

/* ---------- dominio ---------- */
function unitMastery(u){
  const ch=u.ch.map((c,i)=>Math.min(MASTER_BOX,srsGet(u.id+'-'+i).b||0)/MASTER_BOX);
  const chP=ch.reduce((a,b)=>a+b,0)/ch.length;
  const r=ST.units[u.id]||{};
  const tk=[0,1].map(i=>((r.tk||{})[i]||0)>=3?1:0).reduce((a,b)=>a+b,0)/2;
  const rp=(r.rp||0)>=3?1:0;
  const ls=Math.min(2,r.ls||0)/2;
  return {total:0.5*chP+0.25*tk+0.15*rp+0.10*ls,chP,tk,rp,ls};
}
function levelMastery(lv){
  const us=UNITS.filter(u=>u.lv===lv);
  const m=us.reduce((a,u)=>a+unitMastery(u).total,0)/us.length;
  return 0.8*m+(ST.passed[lv]?0.2:0);
}
function routeMastery(){return LEVELS.reduce((a,l)=>a+levelMastery(l.id),0)/LEVELS.length;}
function currentLevel(){let lv=null;LEVELS.forEach(l=>{if(ST.passed[l.id])lv=l.id;});return lv;}
function unitOf(id){return UNITS.find(u=>u.id===id)||UNITS[0];}
function workUnit(){return unitOf(ST.unit);}

/* ---------- voz: síntesis (escuchar) ---------- */
const TTS={ok:'speechSynthesis' in window,voices:[],speaking:false,gen:0,checked:false,broken:false,unlocked:false};
const VOICE_PREF=[/Google US English/i,/Ava/i,/Samantha/i,/Allison/i,/Aria/i,/Jenny/i,/Guy/i,/Michelle/i,/Christopher/i,/Eric/i,/Zira/i,/David/i,/Mark/i,/Alex/i,/Fred/i];
function loadVoices(){
  if(!TTS.ok)return;
  try{TTS.voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en[-_]US/i.test(v.lang));}catch(e){TTS.voices=[];}
  TTS.voices.sort((a,b)=>{const ia=VOICE_PREF.findIndex(r=>r.test(a.name)),ib=VOICE_PREF.findIndex(r=>r.test(b.name));return (ia<0?99:ia)-(ib<0?99:ib);});
  if(typeof onVoices==='function')onVoices();
}
if(TTS.ok){setTimeout(loadVoices,0);try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}setTimeout(loadVoices,800);}
function voiceBy(name,fallbackIdx){return TTS.voices.find(v=>v.name===name)||TTS.voices[fallbackIdx||0]||null;}
function voiceA(){return voiceBy(ST.voice,0);}
function voiceB(){const a=voiceA();if(ST.voice2){const v=TTS.voices.find(x=>x.name===ST.voice2);if(v)return v;}return TTS.voices.find(v=>a&&v.name!==a.name)||a;}
function baseRate(){const lv=workUnit().lv;return (LEVELS[LV_IDX[lv]].rate)*(ST.rate||1);}
function hush(){TTS.gen++;TTS.speaking=false;if(TTS.ok){try{speechSynthesis.cancel();}catch(e){}}setWave(false);}
function splitSent(t){return String(t).match(/[^.!?]+[.!?]*["')\]]*\s*/g)||[String(t)];}
/* lines: [{t, v:'A'|'B'}] → reproduce en orden; resuelve al terminar */
function speakLines(lines,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    if(!TTS.ok){resolve(false);return;}
    let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;}catch(e){}
    hush();const g=++TTS.gen;
    const q=[];lines.forEach(l=>splitSent(sub(l.t)).forEach(s=>{if(s.trim())q.push({t:s.trim(),v:l.v||'A'});}));
    let started=false;
    const rate=clamp((opts.rate||baseRate())*(opts.slow?0.75:1),0.5,1.6);
    const next=i=>{
      if(g!==TTS.gen){resolve(false);return;}
      if(i>=q.length){TTS.speaking=false;setWave(false);resolve(true);return;}
      const u=new SpeechSynthesisUtterance(q[i].t);
      u.lang='en-US';u.rate=rate;
      try{const v=q[i].v==='B'?voiceB():voiceA();if(v)u.voice=v;}catch(e){}
      u.onstart=()=>{started=true;TTS.checked=true;TTS.speaking=true;setWave(true);if(TTS.broken){TTS.broken=false;if(typeof onTTSBroken==='function')onTTSBroken();}};
      u.onend=()=>next(i+1);
      u.onerror=()=>next(i+1);
      try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){resolve(false);}
    };
    if(busy)setTimeout(()=>next(0),80);else next(0);
    if(!TTS.checked)setTimeout(()=>{if(g===TTS.gen&&!started&&!TTS.checked){TTS.broken=true;hush();if(typeof onTTSBroken==='function')onTTSBroken();resolve(false);}},3500);
  });
}
function speak(t,opts){return speakLines([{t,v:'A'}],opts);}
function setWave(on){document.querySelectorAll('.wave').forEach(w=>w.classList.toggle('on',!!on));}

/* ---------- voz: reconocimiento del navegador (opcional) ----------
   Dentro de claude.ai el micrófono de la página está bloqueado; ahí se usa el dictado del teclado.
   Si la página se abre en Chrome o Safari fuera de claude.ai, este botón usa el reconocimiento del navegador. */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let TOP=true;try{TOP=window.top===window.self;}catch(e){TOP=false;}
const STT={ok:!!SRC&&TOP&&!lsGet('cre_stt_blocked',false),rec:null,active:false};
function sttStart(box,onDone){
  if(!STT.ok)return false;
  try{
    const r=new SRC();r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    const base=box.value?box.value.trim()+' ':'';
    r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;box.value=base+t;box.dispatchEvent(new Event('input'));};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){STT.ok=false;lsSet('cre_stt_blocked',true);}STT.active=false;onDone&&onDone(e.error);};
    r.onend=()=>{STT.active=false;onDone&&onDone(null);};
    STT.rec=r;STT.active=true;r.start();return true;
  }catch(e){STT.ok=false;return false;}
}
function sttStop(){try{STT.rec&&STT.rec.stop();}catch(e){}}

}
function aiOn(){return !!AI.fn&&!AI.off;}
function aiErr(e){
  const c=e&&e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){AI.off=true;AI.why='No se dio permiso para usar Claude en esta página. Vuelve a abrirla y acepta el permiso para conversar y evaluar.';return AI.why;}
  if(c==='rate_limited')return 'Claude recibió demasiadas solicitudes o llegaste a tu límite de uso. Intenta de nuevo en unos minutos.';
  if(c==='session_expired')return 'Tu sesión venció. Vuelve a iniciar sesión en claude.ai.';
  if(c==='invalid_json')return 'La respuesta de Claude llegó incompleta. Intenta de nuevo.';
  if(c==='cancelled')return '';
  return 'No se pudo completar la consulta a Claude. Intenta de nuevo.';
}

/* ====================== HOY ====================== */
function session(){
  const d=today();
  if(!ST.session||ST.session.date!==d){
    const order=PAIRS.slice().sort((a,b)=>((ST.pairs[a.id]||{}).n||0)-((ST.pairs[b.id]||{}).n||0));
    ST.session={date:d,done:{},pair:order[0].id};save();
  }
  return ST.session;
}
function blocks(){
  const s=session(),u=workUnit(),due=dueCards(12).length,nw=newChunksFrom(u.id,4).length,pr=PAIRS.find(p=>p.id===s.pair)||PAIRS[0];
  const ai=aiOn();
  return [
    {k:'pron',t:'Calentamiento de sonidos',d:pr.t+' · 6 intentos',m:3},
    {k:'review',t:'Repaso espaciado',d:due?(due===1?'1 frase que te toca hoy':due+' frases que te tocan hoy'):'Nada pendiente por ahora',m:due?Math.ceil(due*0.5):0,skip:!due},
    {k:'new',t:'Frases nuevas',d:nw?nw+' frases de «'+unitOf(newChunksFrom(u.id,1)[0]?CHUNKS[newChunksFrom(u.id,1)[0]].u:u.id).t+'»':'Ya viste todas las frases de la ruta',m:4,skip:!nw},
    {k:'listen',t:'Escucha activa',d:ai?'Audio nivel '+u.lv+' sobre «'+u.en+'» y preguntas que respondes hablando':'Cadena de frases para entrenar el oído',m:6},
    {k:'talk',t:'Conversación',d:ai?'Role-play: '+u.role.split(',')[0]+' · '+u.en:'Tarea de habla con frases modelo',m:8}
  ];
}
function runBlock(k){
  const s=session(),u=workUnit();
  const done=()=>{s.done[k]=true;save();go('hoy');};
  if(k==='pron'){const pr=PAIRS.find(p=>p.id===s.pair)||PAIRS[0];runPractice(pairItems(pr),{title:pr.t,onDone:done});}
  else if(k==='review'){const ids=dueCards(12);if(!ids.length){done();return;}runPractice(ids.map(cardItem),{title:'Repaso espaciado',onDone:done});}
  else if(k==='new'){const ids=newChunksFrom(u.id,4);if(!ids.length){done();return;}runPractice(ids.map(id=>({k:'repeat',cid:id,en:CHUNKS[id].en,es:CHUNKS[id].es})),{title:'Frases nuevas',onDone:done});}
  else if(k==='listen'){if(aiOn())go('escucha',{u:u.id,onDone:done});else runPractice(chainItems(u),{title:'Cadena de escucha',onDone:done});}
  else if(k==='talk'){if(aiOn())go('chat',{u:u.id,onDone:done});else go('tarea',{u:u.id,i:0,onDone:done});}
}

function chainItems(u){

const R={};
function runPractice(items,opts){
  Object.assign(R,{items,i:0,res:[],title:opts.title,onDone:opts.onDone,state:'ask',tries:0});
  UI.screen='run';UI.params=null;hdr();banner();renderRun(true);window.scrollTo(0,0);
}
function pairItems(pr){
  const out=[];
  if(pr.p){
    const ps=shuffle(pr.p);
    for(let i=0;i<6;i++){const pp=ps[i%ps.length];const t=Math.random()<0.5?0:1;
      out.push(i%2===0?{k:'pairL',pid:pr.id,a:pp[0],b:pp[1],tg:pp[t],ot:pp[1-t]}:{k:'pairS',pid:pr.id,a:pp[0],b:pp[1],tg:pp[t],ot:pp[1-t]});}
  }else shuffle(pr.w).slice(0,6).forEach(w=>out.push({k:'word',pid:pr.id,tg:w}));
  return out;
}
function playItem(it,slow){
  if(it.k==='repeat'||it.k==='produce')return speak(it.en,{slow});
  if(it.k==='pairL'||it.k==='pairS'||it.k==='word')return speak(it.tg,{slow,rate:0.85});
  return Promise.resolve();
}
function renderRun(autoplay){
  const m=$('#main'),it=R.items[R.i],n=R.items.length;
  if(!it){return renderRunEnd(m);}
  const asked=R.state==='ask';
  let prompt='';
  if(it.k==='repeat')prompt=`<span class="eyebrow">Transmisión entrante · escucha y repite en voz alta</span>
    <div class="play"><button class="playbtn" type="button" id="pPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}<button class="btn ghost" type="button" id="pSlow">Más lento</button></div>
    <div class="cue en ${asked&&!R.peek?'hidden-text':''}" id="pText">${esc(sub(it.en))}</div>${asked&&!R.peek?'<button class="link" type="button" id="pPeek">No entiendo: ver el texto</button>':`<div class="es">${esc(sub(it.es))}</div>`}`;
  else if(it.k==='produce')prompt=`<span class="eyebrow">Dilo en inglés</span><div class="cue">${esc(sub(it.es))}</div>
    ${asked?(R.hint?`<div class="es">Empieza así: <b>${esc(sub(it.en).split(' ').slice(0,2).join(' '))}…</b></div>`:'<button class="link" type="button" id="pHint">Dame una pista</button>'):`<div class="play"><button class="playbtn" type="button" id="pPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}<div class="cue en">${esc(sub(it.en))}</div></div>`}`;
  else if(it.k==='pairL')prompt=`<span class="eyebrow">¿Qué palabra escuchas? Dila en voz alta</span>
    <div class="play"><button class="playbtn" type="button" id="pPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}<div class="cue en">${esc(it.a)} <span class="es">o</span> ${esc(it.b)}</div></div>`;
  else if(it.k==='pairS')prompt=`<span class="eyebrow">Di esta palabra. El dictado debe escribir exactamente esta</span>
    <div class="cue en" style="font-size:30px">${esc(it.tg)}</div><div class="es">No «${esc(it.ot)}». <button class="link" type="button" id="pPlay2">Escuchar modelo</button></div>`;
  else if(it.k==='word')prompt=`<span class="eyebrow">Di esta palabra</span><div class="cue en" style="font-size:30px">${esc(it.tg)}</div><div class="es"><button class="link" type="button" id="pPlay2">Escuchar modelo</button></div>`;
  m.innerHTML=`<div class="stack"><div class="runhead"><div><span class="eyebrow">${esc(R.title)}</span><h2>${R.i+1} de ${n}</h2></div><button class="btn ghost" type="button" id="rExit">${ICON.back}Salir</button></div>
  <div class="prog"><span style="width:${(100*R.i/n).toFixed(1)}%"></span></div>
  <div class="incoming">${prompt}</div>
  ${asked?txHTML('ans',it.k==='produce'?'Toca aquí y dilo en inglés':'Toca aquí y repite lo que escuchaste')+`<div class="row"><button class="btn primary" type="button" id="rSend">Transmitir</button><button class="btn ghost" type="button" id="rSkip">No sé</button></div>`:R.fbHTML}
  </div>`;
  $('#rExit').onclick=()=>{R.items=R.items.slice(0,R.i);renderRunEnd(m);};
  const pp=$('#pPlay');if(pp)pp.onclick=()=>playItem(it,false);
  const pp2=$('#pPlay2');if(pp2)pp2.onclick=()=>playItem(it,false);
  const ps=$('#pSlow');if(ps)ps.onclick=()=>playItem(it,true);
  const pk=$('#pPeek');if(pk)pk.onclick=()=>{R.peek=true;R.peeked=true;renderRun(false);};
  const ph=$('#pHint');if(ph)ph.onclick=()=>{R.hint=true;renderRun(false);};
  if(asked){
    const tx=wireTx('ans');
    $('#rSend').onclick=()=>{const v=tx.box.value.trim();if(!v){tx.box.focus();return;}judgeRun(it,v,tx.secs());};
    $('#rSkip').onclick=()=>judgeRun(it,'',0);
    if(autoplay&&(it.k==='repeat'||it.k==='pairL'))playItem(it,false);
  }else{
    const nx=$('#rNext');if(nx)nx.onclick=()=>{R.i++;R.state='ask';R.peek=false;R.peeked=false;R.hint=false;R.tries=0;renderRun(true);};
    const rt=$('#rRetry');if(rt)rt.onclick=()=>{R.state='ask';R.peek=it.k==='repeat';R.tries++;renderRun(false);};
    const pm=$('#fbPlay');if(pm)pm.onclick=()=>playItem(it,false);
  }
}
function verdict(score){return score>=0.85?['ok','Bien']:score>=0.6?['near','Casi']:['bad','Otra vez'];}
async function judgeRun(it,said,secs){
  if(said)noteSpoke(said);
  let score=0,body='',k='bad',title='';
  if(it.k==='repeat'||it.k==='produce'){
    const al=align(sub(it.en),said);score=al.score;
    [k,title]=verdict(score);
    if(R.peeked&&k==='ok'){k='near';title='Bien, con el texto a la vista';}
    body=`<div>${diffHTML(al)}</div><div class="legendw"><span><span class="w ok">bien</span></span><span><span class="w near">casi</span></span><span><span class="w miss">faltó</span></span><span><span class="w sub"><s>dicho</s> esperado</span></span></div>
      <div class="cue en">${esc(sub(it.en))}</div><div class="es">${esc(sub(it.es))}</div>`;
    if(it.k==='produce'&&score>=0.4&&score<0.85&&aiOn()&&said){
      R.state='fb';R.fbHTML=`<div class="fb near">${thinkingHTML('Claude revisa si tu frase también es correcta')}</div>`;renderRun(false);
      try{
        const j=await aiJSON(`An English learner (Spanish speaker) was asked to say in English: "${sub(it.es)}". The reference answer is: "${sub(it.en)}". The learner said (speech-to-text transcript, ignore punctuation and capitalization): "${said}".\nIs the learner's sentence a correct and natural way to say it in American English, with the same meaning? Reply with only JSON: {"ok": true or false, "better": "a natural correct version close to what the learner said", "why_es": "one short sentence in Spanish"}`,'quick');
        if(j&&j.ok===true){k='ok';title='Bien: otra forma correcta';score=Math.max(score,0.86);}
        body+=`<div class="fix">${j&&j.ok?'<b>Tu versión es válida.</b> ':''}${esc(j&&j.why_es||'')}${j&&j.better?`<br><b>${esc(j.better)}</b>`:''}</div>`;
      }catch(e){const t=aiErr(e);if(t)body+=`<p class="small">${esc(t)}</p>`;}
    }
  }else{
    const toks=norm(said),tg=it.tg.toLowerCase(),ot=(it.ot||'').toLowerCase();
    const hasT=toks.includes(tg),hasO=ot&&toks.includes(ot);
    score=hasT&&!hasO?1:0;k=score?'ok':'bad';
    title=score?'Bien':'Otra vez';
    const heard=said?`El dictado escribió: «${esc(said)}».`:'No hubo respuesta.';
    if(it.k==='pairL')body=`<p>${heard} La palabra era <b>${esc(it.tg)}</b>.</p><p class="es">${hasO?'Escuchaste o pronunciaste la otra palabra del par. Escucha las dos varias veces y fíjate en la diferencia.':''}</p>`;
    else body=`<p>${heard} ${score?'Se entendió la palabra correcta.':'Se esperaba <b>'+esc(it.tg)+'</b>.'}</p>${!score?`<p class="es">${esc((PAIRS.find(p=>p.id===it.pid)||{}).es||'')}</p>`:''}`;
    if(it.k==='pairL'||it.k==='pairS'){const pr=it.k==='pairL'?[it.tg,it.ot]:[it.a,it.b];body+=`<div class="row"><button class="btn radio" type="button" data-say="${esc(pr[0])}">${esc(pr[0])}</button><button class="btn radio" type="button" data-say="${esc(pr[1])}">${esc(pr[1])}</button></div>`;}
    const ps=ST.pairs[it.pid]||{n:0,ok:0};ps.n++;if(score)ps.ok++;ST.pairs[it.pid]=ps;save();
  }
  if(R.tries===0){
    R.res.push({it,score,said});
    if(it.cid)srsUpdate(it.cid,score>=0.85||(k==='ok'));
  }
  R.state='fb';
  R.fbHTML=`<div class="fb ${k}"><h3>${esc(title)}${it.k==='repeat'||it.k==='produce'?' · '+fmt(100*score)+' %':''}</h3>${body}
    <div class="row">${it.k==='repeat'||it.k==='produce'?`<button class="btn radio" type="button" id="fbPlay">${ICON.play}Escuchar</button>`:''}${k!=='ok'?'<button class="btn" type="button" id="rRetry">Intentar otra vez</button>':''}<button class="btn primary" type="button" id="rNext">${R.i+1<R.items.length?'Siguiente':'Terminar'}</button></div></div>`;
  renderRun(false);
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,{rate:0.85}));
}
function renderRunEnd(m){
  const ok=R.res.filter(r=>r.score>=0.85).length,n=R.res.length;
  const miss=R.res.filter(r=>r.score<0.85&&r.it.en);
  m.innerHTML=`<div class="stack"><span class="eyebrow">${esc(R.title)}</span><h1>${n?fmt(100*ok/n)+' % bien':'Sin intentos'}</h1>
  <p class="lead">${ok} de ${n} transmisiones entendidas a la primera.${miss.length?' Estas vuelven en tu repaso:':''}</p>
  ${miss.length?'<div class="plist">'+miss.map((r,i)=>`<div class="pitem"><button class="icon" type="button" data-p="${i}" aria-label="Escuchar">${ICON.play}</button><div><div class="en">${esc(sub(r.it.en))}</div><div class="es">${esc(sub(r.it.es||''))}</div></div><span class="box">${fmt(100*r.score)} %</span></div>`).join('')+'</div>':''}
  <button class="btn primary wide" type="button" id="endOk">Continuar</button></div>`;
  m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>speak(miss[+b.dataset.p].it.en));
  $('#endOk').onclick=()=>{const f=R.onDone;if(n&&f)f();else go('hoy');};
  hdr();
}

/* ====================== EVALUACIÓN (común) ====================== */
const RUBRIC=`Scores from 0 to 5, where 3 means the learner meets the target CEFR descriptor, 4 is above it and 2 is below it.`;
function evalPromptSpeaking(taskEn,transcript,secs,lv,extra){
  return `You are an expert CEFR speaking examiner for American English.\n${PROFILE}\nTarget level: ${lv}.\nTask: ${taskEn}\n${extra||''}The learner answered by speaking for about ${secs} seconds (approximate). This is the speech-to-text transcript; ignore punctuation and capitalization, and do not blame the learner for obvious recognition slips:\n"""${transcript}"""\nJudge fluency from the transcript only (length and connectedness of the answer, self-repairs). ${RUBRIC}\nReply with only this JSON:\n{"cefr":"A0|A1|A2|B1|B2|C1|C2","range":0,"accuracy":0,"fluency":0,"coherence":0,"task":0,"fixes":[{"said":"exact words from the transcript","better":"corrected version","why_es":"short reason in Spanish"}],"upgrade":"the learner's answer rewritten one CEFR level higher, same ideas, natural American English, at most 110 words","phrases":[{"en":"useful phrase for this task","es":"Spanish translation"}],"summary_es":"two sentences in Spanish: what was good and the single most important thing to improve"}\nAt most 4 fixes and exactly 3 phrases.`;
}
function num(x){const n=Number(x);return isFinite(n)?clamp(n,0,5):0;}
function evalHTML(j,opts){
  opts=opts||{};
  const keys=opts.keys||[['range','Vocabulario'],['accuracy','Gramática'],['fluency','Fluidez'],['coherence','Coherencia'],['task','Tarea']];
  const avg=keys.reduce((a,[k])=>a+num(j[k]),0)/keys.length;
  const fixes=Array.isArray(j.fixes)?j.fixes.slice(0,5):[],ph=Array.isArray(j.phrases)?j.phrases.slice(0,4):[];
  return `<div class="card stack"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">Evaluación de Claude</span><div class="big">${esc(String(j.cefr||'—'))}</div></div><span class="chip ${avg>=3?'ok':avg>=2?'warn':'bad'}">${fmt(avg,1)} / 5</span></div>
  <div class="scores">${keys.map(([k,l])=>`<div><b>${fmt(num(j[k]),0)}</b><span>${l}</span></div>`).join('')}</div>
  ${j.summary_es?`<p>${esc(j.summary_es)}</p>`:''}
  ${fixes.length?'<h3>Correcciones</h3>'+fixes.map(f=>`<div class="fix"><s>${esc(f.said||'')}</s> → <b>${esc(f.better||'')}</b>${f.why_es?`<br><span class="small">${esc(f.why_es)}</span>`:''}</div>`).join(''):''}
  ${j.upgrade?`<h3>Tu respuesta, un nivel más arriba</h3><div class="incoming"><div class="play"><button class="playbtn" type="button" id="upPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}</div><div class="cue en" style="font-size:17px">${esc(j.upgrade)}</div><button class="btn radio" type="button" id="upShadow">Repetirla frase por frase</button></div>`:''}
  ${ph.length?'<h3>Frases para tu repaso</h3>'+ph.map((p,i)=>`<div class="phr"><div><b>${esc(p.en||'')}</b><div class="es">${esc(p.es||'')}</div></div><button class="btn" type="button" data-add="${i}">Agregar</button></div>`).join(''):''}
  </div>`;
}
function wireEval(j,lv,uid,back){
  const up=$('#upPlay');if(up)up.onclick=()=>speak(j.upgrade);
  const sh=$('#upShadow');if(sh)sh.onclick=()=>{const ss=splitSent(j.upgrade).map(s=>s.trim()).filter(s=>s.split(' ').length>=3).slice(0,8);runPractice(ss.map(s=>({k:'repeat',en:s,es:''})),{title:'Versión mejorada',onDone:back});};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=j.phrases[+b.dataset.add];if(!p||!p.en)return;addCustom(p.en,p.es||'',lv,uid);b.textContent='Agregada';b.disabled=true;});
}
function addCustom(en,es,lv,uid){
  const id='x'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
  ST.custom[id]={en:String(en).slice(0,240),es:String(es).slice(0,240),lv:lv||null,u:uid||null,at:Date.now()};
  ST.srs[id]={b:0,due:Date.now(),n:1,l:0};save();
}
function pushEval(type,lv,j,uid){
  ST.evals.push({at:Date.now(),type,lv,u:uid||null,cefr:String(j.cefr||''),range:num(j.range),accuracy:num(j.accuracy),fluency:num(j.fluency),coherence:num(j.coherence),task:num(j.task!=null?j.task:j.interaction)});
  ST.evals=ST.evals.slice(-60);save();
}
function avgOf(j,keys){return keys.reduce((a,k)=>a+num(j[k]),0)/keys.length;}

/* ====================== ESCUCHA ACTIVA ====================== */
const STYLE={A1:'Use very short sentences, the present simple, high-frequency words, numbers, times and plant equipment names. No idioms.',
 A2:'Use short sentences, the past simple and going to, everyday and plant vocabulary, and simple linking words (and, but, because, then).',
 B1:'Use connected speech with common linking words, some phrasal verbs, a clear problem and solution, and simple opinions.',
 B2:'Use natural speed and varied grammar (conditionals, passive, reported speech), technical vocabulary, some fillers (well, you know) and at least one difference of opinion.',
 C1:'Use fully natural American speech: fillers, false starts, idioms, phrasal verbs, implied meaning, understatement or irony, and dense technical detail. At least one important point must be implied rather than stated.'};
const QSTYLE={A1:'Ask about explicit facts (who, what, where, when, how many).',A2:'Ask about explicit facts and the order of events.',B1:'Mix facts and reasons (why).',
 B2:'Include at least one question about a speaker\'s opinion or attitude.',C1:'Include questions about implied meaning, attitude and the speaker\'s purpose, not only facts.'};
const KINDS=['a radio call between two people','a shift handover conversation between two coworkers','a voicemail message','a short conversation in a meeting','a short talk by an engineer to the team','a conversation between two coworkers during a break'];
function listenPrompt(u,lv,nq,exam){
  const L=LEVELS[LV_IDX[lv]],kind=exam?pick(['a conversation between two coworkers','a short talk by an engineer','a discussion in a meeting']):KINDS[(UNITS.indexOf(u)+((ST.units[u.id]||{}).ls||0))%KINDS.length];
  return `You write listening practice material for an English course.\n${PROFILE}\nCEFR level of this listening text: ${lv}${exam?' (this is a level test: make it a fair, typical '+lv+' listening task)':''}.\nTopic and situation: "${u.en}". ${u.ctx}\nWrite ${kind} in natural American English, about ${L.words} words in total. ${STYLE[lv]}\nThen write ${nq} questions in English that can be answered aloud in one or two sentences. ${QSTYLE[lv]}\nReply with only this JSON:\n{"title":"short title","speakers":["first name","first name"],"lines":[{"s":0,"t":"..."},{"s":1,"t":"..."}],"questions":[{"q":"question","q_es":"Spanish translation of the question","answer":"short model answer"}],"vocab":[{"en":"word or phrase","es":"Spanish translation"}]}\nRules: "s" is the speaker index; for a monologue use only 0 and split it into turns of one to three sentences. Write numbers as words. Give 4 to 6 vocab items.`;
}
function gradeListenPrompt(text,qs,answers,lv){
  return `Grade a listening comprehension quiz for an English learner (CEFR ${lv}). The learner answered by speaking: answers are speech-to-text transcripts, so ignore punctuation, capitalization, grammar and small recognition errors, and judge only whether the meaning shows the learner understood.\nListening text:\n"""${text}"""\nQuestions, model answers and the learner's answers:\n${qs.map((q,i)=>`${i+1}. Q: ${q.q} | Model: ${q.answer} | Learner: "${answers[i]||''}"`).join('\n')}\nReply with only this JSON:\n{"items":[{"score":0.0,"fb_es":"one short sentence in Spanish","better":"a natural, correct way to say the answer in English"}],"tip_es":"one practical listening tip in Spanish"}\nscore is from 0 (wrong or empty) to 1 (fully correct); one item per question, in order.`;
}
function validPassage(j){return j&&Array.isArray(j.lines)&&j.lines.length&&Array.isArray(j.questions)&&j.questions.length;}
SCREENS.escucha=(m,p)=>{
  const u=unitOf(p.u),lv=p.lv||u.lv,back=p.onDone||(()=>go('unidad',{u:u.id}));
  const S={j:null,show:false,ctl:null};
  const shell=inner=>{m.innerHTML=`<div class="stack"><div class="runhead"><div><span class="eyebrow">${lv} · escucha activa</span><h2>${esc(u.en)}</h2></div><button class="btn ghost" type="button" id="lBack">${ICON.back}Salir</button></div>${inner}</div>`;
    $('#lBack').onclick=()=>{if(S.ctl)S.ctl.abort();hush();back();};};
  if(!aiOn()){shell(needAI()+`<button class="btn primary" type="button" id="lChain">Hacer la cadena de escucha sin Claude</button>`);$('#lChain').onclick=()=>runPractice(chainItems(u),{title:'Cadena de escucha',onDone:back});return;}
  const gen=async()=>{
    shell(`<div class="card stack">${thinkingHTML('Claude prepara un audio nuevo de nivel '+lv)}<p class="small">Suele tardar entre 5 y 40 segundos.</p><button class="btn" type="button" id="lStop">Cancelar</button></div>`);
    S.ctl=new AbortController();$('#lStop').onclick=()=>S.ctl.abort();
    try{
      const j=await aiJSON(listenPrompt(u,lv,lv==='A1'?3:lv==='A2'?4:5,false),LV_IDX[lv]>=3?'default':'quick',{signal:S.ctl.signal,cache:false});
      if(!validPassage(j))throw {code:'invalid_json'};
      S.j=j;draw();
    }catch(e){const t=aiErr(e);shell(`<div class="fb bad">${esc(t||'Cancelado.')}</div><button class="btn primary" type="button" id="lRetry">Intentar otra vez</button>`);$('#lRetry').onclick=gen;}
  };
  const lines=()=>S.j.lines.map(l=>({t:String(l.t||''),v:(+l.s===1)?'B':'A'}));
  const fullText=()=>S.j.lines.map(l=>(S.j.speakers&&S.j.speakers[+l.s||0]?S.j.speakers[+l.s||0]+': ':'')+l.t).join('\n');
  const low=LV_IDX[lv]<=1;
  const draw=()=>{
    const j=S.j;
    shell(`<div class="incoming"><span class="eyebrow">Transmisión entrante · ${esc(j.title||'')}</span>
      <div class="play"><button class="playbtn" type="button" id="lPlay" aria-label="Escuchar">${ICON.play}</button>${waveHTML()}<button class="btn ghost" type="button" id="lSlow">Más lento</button></div>
      ${low&&Array.isArray(j.vocab)?`<div class="es">Palabras clave: ${j.vocab.map(v=>`<b>${esc(v.en)}</b> (${esc(v.es)})`).join(', ')}</div>`:''}
      <button class="link" type="button" id="lShow">${S.show?'Ocultar la transcripción':'Ver la transcripción (mejor después de escuchar dos veces)'}</button>
      ${S.show?`<div class="small" style="white-space:pre-line;font-size:15px;color:var(--ink)">${esc(fullText())}</div>`:''}</div>
      <p class="lead">Escucha las veces que necesites. Luego responde cada pregunta hablando.</p>
      ${j.questions.map((q,i)=>`<div class="card stack"><div class="row"><button class="icon" type="button" data-q="${i}" aria-label="Escuchar la pregunta">${ICON.play}</button><b style="flex:1;min-width:0">${i+1}. ${esc(q.q)}</b></div>${low&&q.q_es?`<div class="es">${esc(q.q_es)}</div>`:''}${txHTML('q'+i,'Responde hablando')}</div>`).join('')}
      <button class="btn primary wide" type="button" id="lSend">Enviar respuestas</button><div id="lOut"></div>`);
    $('#lPlay').onclick=()=>speakLines(lines());
    $('#lSlow').onclick=()=>speakLines(lines(),{slow:true});
    $('#lShow').onclick=()=>{S.show=!S.show;S.peeked=true;draw();};
    m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>speak(j.questions[+b.dataset.q].q));
    const txs=j.questions.map((q,i)=>wireTx('q'+i));
    $('#lSend').onclick=async()=>{
      const ans=txs.map(t=>t?t.box.value.trim():'');
      ans.forEach(a=>{if(a)noteSpoke(a);});
      $('#lSend').disabled=true;$('#lOut').innerHTML=`<div class="card">${thinkingHTML('Claude revisa tus respuestas')}</div>`;
      try{
        const g=await aiJSON(gradeListenPrompt(S.j.lines.map(l=>l.t).join(' '),j.questions,ans,lv),'quick');
        const items=(g&&Array.isArray(g.items)?g.items:[]);
        const sc=j.questions.map((q,i)=>clamp(Number((items[i]||{}).score)||0,0,1));
        const pct=sc.reduce((a,b)=>a+b,0)/sc.length;
        if(pct>=0.7&&!S.peeked){const r=ST.units[u.id]||(ST.units[u.id]={});r.ls=(r.ls||0)+1;save();}
        $('#lOut').innerHTML=`<div class="fb ${pct>=0.7?'ok':pct>=0.5?'near':'bad'}"><h3>${fmt(100*pct)} % de comprensión</h3>${S.peeked&&pct>=0.7?'<p class="small">Viste la transcripción antes de responder: no cuenta para el dominio de la unidad.</p>':''}
          ${j.questions.map((q,i)=>`<div class="fix"><b>${i+1}. ${fmt(100*sc[i])} %</b> ${esc((items[i]||{}).fb_es||'')}<br><span class="small">Modelo: ${esc((items[i]||{}).better||q.answer)}</span></div>`).join('')}
          ${g&&g.tip_es?`<p>${esc(g.tip_es)}</p>`:''}</div>
          ${Array.isArray(j.vocab)?'<div class="card"><h3>Vocabulario del audio</h3>'+j.vocab.map((v,i)=>`<div class="phr"><div><b>${esc(v.en)}</b><div class="es">${esc(v.es)}</div></div><button class="btn" type="button" data-v="${i}">Agregar</button></div>`).join('')+'</div>':''}
          <div class="row"><button class="btn radio" type="button" id="lShadow">Repetir el audio frase por frase</button><button class="btn" type="button" id="lNew">Otro audio</button><button class="btn primary" type="button" id="lDone">Listo</button></div>`;
        m.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=j.vocab[+b.dataset.v];addCustom(v.en,v.es,lv,u.id);b.textContent='Agregada';b.disabled=true;});
        $('#lShadow').onclick=()=>runPractice(S.j.lines.flatMap(l=>splitSent(l.t)).map(s=>s.trim()).filter(s=>s.split(' ').length>=3).slice(0,10).map(s=>({k:'repeat',en:s,es:''})),{title:'Sombra del audio',onDone:back});
        $('#lNew').onclick=()=>{S.show=false;S.peeked=false;gen();};
        $('#lDone').onclick=()=>back();
      }catch(e){$('#lOut').innerHTML=`<div class="fb bad">${esc(aiErr(e)||'Cancelado.')}</div>`;$('#lSend').disabled=false;}
    };
  };
  gen();
};

SCREENS.hablar=(m)=>{
  const u=workUnit();
  m.innerHTML=`<div class="stack"><div><h1>Conversar</h1><p class="lead">Claude hace de supervisor, colega o entrevistador estadounidense. Tú escuchas su voz y respondes hablando. Al final te evalúa con los descriptores del MCER.</p></div>
  ${aiOn()?'':needAI()}
  <button class="btn primary wide" type="button" data-c="${u.id}">Role-play de tu unidad: ${esc(u.en)}</button>
  <div class="card stack"><h3>Charla libre</h3><p class="lead" style="margin:0">Un colega estadounidense conversa contigo de lo que quieras: tu trabajo, tu país, tus planes de viaje.</p>
    <div class="row">${LEVELS.map(l=>`<button class="btn" type="button" data-f="${l.id}">${l.id}</button>`).join('')}</div></div>
  ${LEVELS.map(l=>`<div class="card stack"><h3>${l.id} · situaciones</h3><div class="units">${UNITS.filter(x=>x.lv===l.id).map(x=>`<button type="button" data-c="${x.id}"><b>${esc(x.en)}</b><small>${esc(x.role)}</small></button>`).join('')}</div></div>`).join('')}</div>`;
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>go('chat',{u:b.dataset.c}));
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>go('chat',{free:b.dataset.f}));
};
function chatRules(u,lv,free){
  const L=LEVELS[LV_IDX[lv]];
  const scen=free?'A relaxed conversation between two coworkers at a copper mine in Arizona. Talk about whatever the learner wants: work, Peru, life in the US, plans, opinions.':u.ctx;
  const role=free?'Sam, a friendly American coworker who asks good follow-up questions':u.role;
  const me=free?'a Peruvian metallurgical engineer':u.me;
  return `Let's do a spoken role-play so I can practice American English. Stay in character for the whole conversation.\nScenario: ${scen}\nYour role: ${role}. My role: ${me}.\nMy CEFR level: ${lv}. ${L.talk}\nRules:\n- Reply ONLY with your next spoken line: no stage directions, no translations, no lists, no emojis, no notes about my English.\n- Keep each reply under ${L.maxw} words and usually end with a question or a prompt that makes me speak.\n- My messages are speech-to-text transcripts: ignore punctuation, capitalization and small recognition errors.\n- If an error of mine blocks meaning, naturally rephrase what I said correctly inside your reply and continue.\n- If I write in Spanish, answer in simple English and help me say it in English.\n${free?'':'- Steer the conversation toward this goal for me: '+u.goal+' (the goal is in Spanish; keep speaking English).\n'}Start now with your first line.`;
}
SCREENS.chat=(m,p)=>{
  const free=p.free||null,u=free?workUnit():unitOf(p.u),lv=free||u.lv,back=p.onDone||(()=>go('hablar'));
  const C={rules:chatRules(u,lv,free),turns:[],busy:false,ctl:null,show:{},tr:{},ended:false};
  UI.leave=()=>{if(C.ctl)C.ctl.abort();};
  const maxT=TURNS[lv];
  const mine=()=>C.turns.filter(t=>t.role==='user').length;
  const draw=(focus)=>{
    m.innerHTML=`<div class="stack"><div class="runhead"><div><span class="eyebrow">${lv} · ${free?'charla libre':'role-play'}</span><h2>${esc(free?'Charla con Sam':u.en)}</h2></div><button class="btn ghost" type="button" id="cBack">${ICON.back}Salir</button></div>
    <p class="small" style="margin:0">${free?'Habla de lo que quieras.':'Tu papel: <i>'+esc(u.me)+'</i>. Objetivo: '+esc(u.goal)}</p>
    ${aiOn()?'':needAI()}
    <div class="chat" id="chatList">${C.turns.map((t,i)=>t.role==='assistant'?`<div class="msg them"><span class="eyebrow" style="color:var(--radio)">Entrante</span>
      <div class="${ST.listenFirst&&!C.show[i]?'hidden-text':''}">${esc(t.content)}</div>${C.tr[i]?`<div class="es">${esc(C.tr[i])}</div>`:''}
      <div class="meta"><button class="icon" type="button" data-pl="${i}" aria-label="Escuchar">${ICON.play}</button>${ST.listenFirst&&!C.show[i]?`<button class="link" type="button" data-sh="${i}">Ver texto</button>`:''}${C.tr[i]?'':`<button class="link" type="button" data-tr="${i}">¿Qué dijo?</button>`}</div></div>`:`<div class="msg me">${esc(t.content)}</div>`).join('')}
      ${C.busy?`<div class="msg them">${thinkingHTML(C.turns.length?'Escribiendo':'Preparando la conversación')}</div>`:''}</div>
    ${C.err?`<div class="fb bad">${esc(C.err)}</div>`:''}
    ${C.ended?'':(C.turns.length&&!C.busy?txHTML('cAns','Toca aquí y responde hablando')+`<div class="row"><button class="btn primary" type="button" id="cSend">Transmitir</button><span class="small">${mine()} de ${maxT} turnos</span><button class="btn" type="button" id="cEnd"${mine()<3?' disabled':''}>Terminar y evaluar</button></div>`:'')}
    ${!C.turns.length&&!C.busy&&aiOn()?'<button class="btn primary wide" type="button" id="cStart">Empezar la conversación</button>':''}
    <div id="cOut"></div></div>`;
    $('#cBack').onclick=()=>{if(C.ctl)C.ctl.abort();hush();back();};
    m.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>speak(C.turns[+b.dataset.pl].content));
    m.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{C.show[+b.dataset.sh]=true;draw();});
    m.querySelectorAll('[data-tr]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.tr;b.textContent='Traduciendo…';b.disabled=true;
      try{const r=await AI.fn('Translate into natural Latin American Spanish. Reply with only the translation:\n\n'+C.turns[i].content,{modelTier:'quick'});C.tr[i]=r.text.trim();C.show[i]=true;}catch(e){C.err=aiErr(e);}draw();});
    const st=$('#cStart');if(st)st.onclick=()=>ask();
    if(!C.ended&&C.turns.length&&!C.busy){
      const tx=wireTx('cAns');
      if(focus&&tx)setTimeout(()=>{try{tx.box.focus({preventScroll:true});}catch(e){}},50);
      $('#cSend').onclick=()=>{const v=tx.box.value.trim();if(!v){tx.box.focus();return;}noteSpoke(v);C.turns.push({role:'user',content:v,secs:tx.secs()});
        if(mine()>=maxT){draw();evaluate();}else ask();};
      $('#cEnd').onclick=()=>evaluate();
    }
    const list=$('#chatList');if(list&&list.lastElementChild&&C.turns.length>1)list.lastElementChild.scrollIntoView({block:'nearest'});
  };
  const ask=async()=>{
    C.busy=true;C.err='';draw();
    C.ctl=new AbortController();
    const msgs=[{role:'user',content:C.rules},...C.turns.map(t=>({role:t.role,content:t.content}))];
    if(msgs[msgs.length-1].role!=='user')msgs.push({role:'user',content:'(continue)'});
    try{
      const r=await AI.fn(msgs.slice(0,1).concat(msgs.slice(1).slice(-24)),{modelTier:'quick',cache:false,signal:C.ctl.signal});
      const line=r.text.trim().replace(/^["“]|["”]$/g,'');
      C.turns.push({role:'assistant',content:line});C.busy=false;draw(true);
      speak(line);
    }catch(e){C.busy=false;C.err=aiErr(e);draw();}
  };
  const evaluate=async()=>{
    C.ended=true;draw();
    $('#cOut').innerHTML=`<div class="card">${thinkingHTML('Claude evalúa la conversación')}</div>`;
    const transcript=C.turns.map(t=>(t.role==='assistant'?'PARTNER: ':'LEARNER: ')+t.content).join('\n');
    const secs=C.turns.reduce((a,t)=>a+(t.secs||0),0);
    const prompt=`You are an expert CEFR speaking examiner for American English.\n${PROFILE}\nTarget level: ${lv}.\nRole-play scenario: ${free?'free conversation with a coworker':u.ctx} The learner's goal: ${free?'keep a natural conversation':u.goal}\nTranscript (the learner's lines are speech-to-text transcripts; ignore punctuation and capitalization, and do not blame the learner for obvious recognition slips; the learner spoke for about ${secs} seconds in total):\n"""\n${transcript}\n"""\nAssess only the LEARNER. Judge fluency from the transcript (length and connectedness of turns). ${RUBRIC}\nReply with only this JSON:\n{"cefr":"A0|A1|A2|B1|B2|C1|C2","range":0,"accuracy":0,"fluency":0,"coherence":0,"interaction":0,"fixes":[{"said":"exact learner words","better":"corrected version","why_es":"short reason in Spanish"}],"upgrade":"the learner's best turn rewritten one CEFR level higher, natural American English, at most 80 words","phrases":[{"en":"useful phrase for this situation","es":"Spanish translation"}],"summary_es":"two sentences in Spanish: what was good and the single most important thing to improve"}\nAt most 5 fixes and exactly 3 phrases.`;
    try{
      const j=await aiJSON(prompt,'default');
      const keys=['range','accuracy','fluency','coherence','interaction'];
      const avg=avgOf(j,keys);
      if(!free){const r=ST.units[u.id]||(ST.units[u.id]={});r.rp=Math.max(r.rp||0,avg);}
      pushEval(free?'charla':'roleplay',lv,j,free?null:u.id);
      $('#cOut').innerHTML=evalHTML(j,{keys:[['range','Vocabulario'],['accuracy','Gramática'],['fluency','Fluidez'],['coherence','Coherencia'],['interaction','Interacción']]})+`<div class="row"><button class="btn" type="button" id="cAgain">Otra conversación</button><button class="btn primary" type="button" id="cDone">Listo</button></div>`;
      wireEval(j,lv,free?null:u.id,()=>go('chat',p));
      $('#cAgain').onclick=()=>go('chat',p);$('#cDone').onclick=()=>back();
    }catch(e){$('#cOut').innerHTML=`<div class="fb bad">${esc(aiErr(e)||'Cancelado.')}</div><button class="btn" type="button" id="cRe">Intentar evaluar otra vez</button>`;$('#cRe').onclick=()=>evaluate();}
  };
  draw();
};
